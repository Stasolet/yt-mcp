[project]
name = "youtrack-mcp"
version = "0.1.0"
description = "MCP server for JetBrains YouTrack 2022.3 (issues + boards) for opencode"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["youtrack_mcp"]
